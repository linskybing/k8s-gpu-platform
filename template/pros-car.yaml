apiVersion: v1
kind: Pod
metadata:
  name: ros2-pros-car
  annotations:
    k8s.v1.cni.cncf.io/networks: "default/macvlan-conf"
  labels:
    app: pros_car
spec:
  containers:
    - name: pros-car
      image: "ghcr.io/screamlab/pros_car_docker_image:latest"
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c","--"]
      args: ["trap : TERM INT; sleep infinity & wait"]
      resources:
        requests:
          memory: "256Mi"
        limits:
          nvidia.com/gpu: "1"
      envFrom:
        - configMapRef:
            name: pros-car-env
      volumeMounts:
        - name: user-home
          mountPath: /workspaces/src
          subPath: pros_car/src
        - name: user-home
          mountPath: /workspaces/screenshots
          subPath: pros_car/screenshots
  volumes:
    - name: user-home
      persistentVolumeClaim:
        claimName: "{{userVolume}}"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: pros-car-env
data:
  ROS_DOMAIN_ID: "1"
  RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
  ROS_LOCALHOST_ONLY: "0"
